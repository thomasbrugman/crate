name: t3stash macOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/t3stash-macos.yml"
      - "scripts/build-desktop-artifact.*"

permissions:
  contents: read

jobs:
  macos:
    name: Package universal Mac app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts... --frozen-lockfile

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build unsigned app
        env:
          T3CODE_DESKTOP_SIGNED: "false"
        run: env -u GITHUB_REPOSITORY vp run dist:desktop:artifact --platform mac --target zip --arch universal

      - name: Check packaged app
        run: |
          archives=(release/*-universal.zip)
          ditto -x -k "${archives[0]}" "$RUNNER_TEMP/t3stash"
          app=("$RUNNER_TEMP"/t3stash/*.app)
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app[0]}/Contents/Info.plist")"
          binary="${app[0]}/Contents/MacOS/$executable"
          lipo -info "$binary"
          lipo "$binary" -verify_arch arm64 x86_64
          node scripts/smoke-desktop-app.ts --executable "$binary" --artifacts-dir "$RUNNER_TEMP/desktop-launch-check"

      - name: Upload universal ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: release/*-universal.zip
          archive: false
          if-no-files-found: error
